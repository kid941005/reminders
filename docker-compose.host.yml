services:
  kid941005-reminders:
    # Tracks the newest published image.
    image: ghcr.io/kid941005/reminders:latest
    container_name: kid941005-reminders
    # 启动前先复制 .env.example 为 .env，并按需填写。
    # 运行参数与通知渠道凭据统一从根目录 .env 读取。
    env_file:
      - .env
    # host 网络不做端口映射：容器直接监听宿主机上的 PORT。
    network_mode: host
    volumes:
      # 数据库、上传文件、日志和配置均持久化到此目录。
      - ./data:/app/data
    command: ["-data-dir", "/app/data", "-web-dir", "./static/dist", "-device-type", "docker"]
    restart: unless-stopped

  # 可选：小智语音 MCP 适配器，默认不启动。
  # 镜像由 GitHub Actions 构建并推送到 ghcr.io。
  # 用法：先将 reminder-mcp/.env.example 的变量补充到根目录 .env
  #       docker compose --profile mcp pull && docker compose --profile mcp up -d
  reminder-mcp:
    profiles: ["mcp"]
    image: ghcr.io/kid941005/reminders-mcp:latest
    container_name: reminder-mcp
    network_mode: host
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - kid941005-reminders
    restart: unless-stopped
