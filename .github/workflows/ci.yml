name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # SQLite 驱动依赖 CGO，ubuntu runner 自带 gcc，无需额外安装。
      - name: 编译
        working-directory: server
        run: go build ./...

      - name: 测试
        working-directory: server
        run: go test ./... -count=1

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci

      # npm run build = vue-tsc && vite build，类型错误会让本步骤失败。
      - name: 构建（含类型检查）
        working-directory: web
        run: npm run build

  image:
    name: 构建并推送镜像
    # 只在打 tag 时执行；Docker Hub 凭据未配置时自动跳过，避免 fork 者 CI 变红。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 Docker Hub 凭据
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，跳过镜像推送。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 记录构建时间
        id: buildtime
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: steps.creds.outputs.available == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.available == 'true'

      - uses: docker/login-action@v3
        if: steps.creds.outputs.available == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        if: steps.creds.outputs.available == 'true'
        id: meta
        with:
          images: kid941005/reminders
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        if: steps.creds.outputs.available == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_TIME=${{ steps.buildtime.outputs.value }}
            GIT_COMMIT=${{ github.sha }}

  release:
    name: 创建 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 发布说明取 CHANGELOG 中该版本的小节；取不到时退化为空说明。
      - name: 提取版本说明
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## v" ver { flag=1; next }
            flag && /^## v/ { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          echo "lines=$(wc -l < release-notes.md)" >> "$GITHUB_OUTPUT"

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.notes.outputs.lines }}" -gt 0 ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
