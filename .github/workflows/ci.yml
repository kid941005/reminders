name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # SQLite 驱动依赖 CGO，ubuntu runner 自带 gcc，无需额外安装。
      - name: 编译
        working-directory: server
        run: go build ./...

      - name: 测试
        working-directory: server
        run: go test ./... -count=1

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci

      # npm run build = vue-tsc && vite build，类型错误会让本步骤失败。
      - name: 构建（含类型检查）
        working-directory: web
        run: npm run build

  image:
    name: 构建并推送镜像
    # 只在打 tag 时执行。主目标是 ghcr.io：它用本 workflow 自带的 GITHUB_TOKEN
    # 就能推送，不需要仓库里配置任何 secret。Docker Hub 是可选附加目标，
    # 配了 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 才会多推一份。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 记录构建时间
        id: buildtime
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: 检查 Docker Hub 凭据
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "未配置 Docker Hub 凭据，本次只推送到 ghcr.io。" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 只构建 amd64，不再需要 QEMU 跨架构模拟。
      # 原 arm64 走 QEMU 时，镜像内的 npm ci + vite 构建会长时间挂起
      # （v0.11.3 曾跑满 6 小时被 GitHub 超时取消）。
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta-ghcr
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: 构建并推送 ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_TIME=${{ steps.buildtime.outputs.value }}
            GIT_COMMIT=${{ github.sha }}

      - name: 登录 Docker Hub
        if: steps.creds.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        if: steps.creds.outputs.available == 'true'
        id: meta-dockerhub
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/reminders
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # 复用上一步的构建缓存，第二次推送只多花传输时间。
      - name: 构建并推送 Docker Hub
        if: steps.creds.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-dockerhub.outputs.labels }}
          cache-from: type=gha
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_TIME=${{ steps.buildtime.outputs.value }}
            GIT_COMMIT=${{ github.sha }}

  release:
    name: 创建 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 发布说明取 CHANGELOG 中该版本的小节；取不到时退化为空说明。
      - name: 提取版本说明
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## v" ver { flag=1; next }
            flag && /^## v/ { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          echo "lines=$(wc -l < release-notes.md)" >> "$GITHUB_OUTPUT"

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.notes.outputs.lines }}" -gt 0 ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
