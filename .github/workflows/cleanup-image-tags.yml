name: Cleanup image tags

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "真正删除/重建标签（默认 false 只预演）"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    name: 清理 GHCR 标签
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装依赖
        run: python -m pip install --quiet requests

      - name: 预演/执行清理
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY: ${{ inputs.apply }}
          PACKAGES: reminders,reminders-mcp
        run: python scripts/cleanup_image_tags.py
