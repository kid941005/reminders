name: Cleanup image tags

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "真正删除/重建标签（默认 false 只预演）"
        required: true
        default: false
        type: boolean
      packages:
        description: "要清理的包，逗号分隔"
        required: false
        default: "reminders,reminders-mcp"
        type: string
      limit:
        description: "最多处理的版本数，0 表示全部（用于小范围试跑）"
        required: false
        default: "0"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    name: 清理 GHCR 标签
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装依赖
        run: python -m pip install --quiet requests

      - name: 预演/执行清理
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY: ${{ inputs.apply }}
          PACKAGES: ${{ inputs.packages }}
          LIMIT: ${{ inputs.limit }}
        run: python scripts/cleanup_image_tags.py
