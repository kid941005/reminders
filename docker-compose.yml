services:
  kid941005-reminders:
    # Tracks the newest published image.
    image: ghcr.io/kid941005/reminders:latest
    container_name: kid941005-reminders
    ports:
      - "8906:8906"
    volumes:
      # 数据库、上传文件、日志和配置均持久化在此卷中。
      - kid941005-reminders-data:/app/data
    environment:
      - ENV=release
      - DATA_DIR=/app/data
      # 匿名统计默认关闭；如需接入，额外设置 STATS_ENDPOINT 并加 -disable-stats=false
    command: ["-data-dir", "/app/data", "-web-dir", "./static/dist", "-device-type", "docker"]
    restart: unless-stopped

volumes:
  kid941005-reminders-data:
